<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЦОД Магнат</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: tycoon console — the hall floor plan is the stage on the left, management tabs on the right. Single dark look by choice. */
:root {
  --room: #0b1015;
  --panel: #131a21;
  --panel-2: #18212a;
  --metal-hi: #26323d;
  --bay: #090d11;
  --line: #26313c;
  --fg: #d6e0ea;
  --dim: #7a8897;
  --accent: #6cb4ff;
  --accent-ink: #06121f;
  --ok: #4fd18b;
  --warn: #f2b24a;
  --crit: #ff5f5f;
  --cpu: #4a8fd6;
  --sto: #a184e6;
  --gpu: #e8913f;
  --scrim: rgba(5, 8, 11, .8);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse 70% 40% at 30% -10%, rgba(108, 180, 255, .07), transparent 70%), var(--room);
  color: var(--fg);
  font: 14px/1.45 var(--f-body);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 1440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  display: grid; gap: 12px;
}

/* Top bar */
.bar { display: grid; grid-template-columns: auto auto; justify-content: space-between; align-items: center; gap: 10px 16px; }
.logo { font: 800 22px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
.logo span { color: var(--accent); }
.res { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(116px, 1fr)); gap: 6px; }
.chip {
  display: grid; gap: 1px; padding: 5px 9px; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
}
.chip .k { font: 500 9.5px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.chip .v { font: 600 15px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rRep { font-family: var(--f-body); }
.v.pos { color: var(--ok); } .v.neg { color: var(--crit); }
.stars { color: var(--warn); letter-spacing: 1px; }
.stars i { font-style: normal; color: var(--metal-hi); }
.ctl { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; padding: 5px 11px;
  background: var(--metal-hi); border: 1px solid var(--line); border-radius: 4px;
  cursor: pointer; font-weight: 500; font-size: 13px; text-align: left;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--crit); }
.btn.hot { background: var(--crit); border-color: var(--crit); color: #fff; font-weight: 600; animation: pulse .6s infinite; }
.btn.sm { min-height: 26px; padding: 2px 8px; font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { min-height: 32px; padding: 4px 9px; border: 0; background: var(--panel); cursor: pointer; font: 600 12px var(--f-mono); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.status { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px; }
.status > .goal, .status > .event {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-content: center; gap: 2px 12px;
  height: 74px; overflow: hidden;
}
.status > div > span {
  grid-column: 1 / -1; grid-row: 2;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.goal {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
}
.goal b { font: 600 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.goal span { flex: 1 1 240px; }
.goal em { font: 600 12px var(--f-mono); font-style: normal; color: var(--ok); }

.event {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--crit); border-radius: 4px;
}
.event.mild { border-left-color: var(--warn); }
.event.good { border-left-color: var(--ok); }
.event.calm { border-left-color: var(--line); }
.event.calm span { color: var(--dim); }
.event strong { font-weight: 600; }
.event span { color: var(--dim); flex: 1 1 260px; }
.event .left { font: 600 12px var(--f-mono); color: var(--warn); flex: 0 0 auto; }

/* Main */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 14px; align-items: start; }
.floor { display: grid; gap: 8px; min-width: 0; }
.halls { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; }
.halls button {
  flex: 0 0 auto; display: grid; gap: 0; text-align: left;
  padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); cursor: pointer; min-width: 0;
}
.halls button span, .halls button small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.halls button small { font: 500 10.5px var(--f-mono); color: var(--dim); }
.halls button[aria-pressed="true"] { background: var(--panel-2); border-color: var(--accent); }
.halls button.locked { opacity: .6; }
.halls button.alarm small { color: var(--crit); }
.hallinfo { display: flex; flex-wrap: wrap; gap: 4px 16px; min-height: 2.6em; align-content: flex-start; font: 500 12px var(--f-mono); color: var(--dim); }
.hallinfo b { color: var(--fg); font-weight: 600; }
.hallinfo .over { color: var(--crit); }
.canvasbox {
  position: relative; background: var(--bay); border: 1px solid var(--line); border-radius: 6px;
  overflow: hidden; display: grid; place-items: center; padding: 8px; min-height: 280px;
}
canvas { display: block; touch-action: manipulation; cursor: pointer; max-width: 100%; }
.tag.urgent { background: rgba(255, 95, 95, .2); color: #ff9c9c; }
.tag.good { background: rgba(79, 209, 139, .2); color: #8fe6b5; }
.tag.vip { background: rgba(242, 178, 74, .22); color: #f6cd85; }
.curve { width: 100%; height: 70px; display: block; }
.mkt { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mkt div { padding: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; display: grid; gap: 2px; }
.mkt b { font: 600 16px var(--f-mono); }
.mkt svg { width: 100%; height: 26px; display: block; }
.up { color: var(--ok); } .down { color: var(--crit); }
.bids { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.bids .btn { flex-direction: column; align-items: center; gap: 0; padding: 6px 4px; }
.bids .btn small { font: 500 11px var(--f-mono); color: var(--dim); }
.bids .btn[aria-pressed="true"] { border-color: var(--accent); background: rgba(108, 180, 255, .16); }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.lockcard { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; padding: 16px; background: rgba(9, 13, 17, .78); }
.lockcard h3 { margin: 0; font: 800 18px var(--f-display); text-transform: uppercase; }
.lockcard p { margin: 0; color: var(--dim); }
.tools { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.tools .btn { flex-direction: column; align-items: flex-start; gap: 0; padding: 4px 9px; line-height: 1.2; }
.tools .btn small { font: 500 10.5px var(--f-mono); color: var(--dim); }
.tools .btn[aria-pressed="true"] { border-color: var(--accent); background: rgba(108, 180, 255, .16); }
.tools .sep { flex: 1 1 0; }

/* Side */
.side { display: grid; gap: 12px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); border-bottom: 1px solid var(--line); }
.tabs button {
  padding: 9px 6px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; white-space: nowrap;
  font: 600 12px var(--f-body); color: var(--dim);
}
.tabs button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs button sup { font: 600 9px var(--f-mono); color: var(--accent); }
.tabbody { padding: 14px; height: min(620px, 72vh); overflow: auto; overscroll-behavior: contain; display: grid; grid-auto-rows: max-content; gap: 12px; align-content: start; }
.tabbody h3 { margin: 0; font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.tabbody p { margin: 0; }
.muted { color: var(--dim); font-size: 13px; }
.ttl { font-weight: 600; font-size: 15px; }
.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .crit { color: var(--crit); }
.list { display: grid; gap: 8px; }
.item { display: grid; gap: 6px; padding: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
.item.done { opacity: .55; }
.item.cur { border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; justify-content: space-between; }
.row > :first-child { min-width: 0; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font: 600 10.5px var(--f-mono); background: var(--metal-hi); white-space: nowrap; }
.tag.cpu { background: rgba(74, 143, 214, .25); color: #9cc6f2; }
.tag.sto { background: rgba(161, 132, 230, .25); color: #c9b8f5; }
.tag.gpu { background: rgba(232, 145, 63, .25); color: #f4bd88; }
.meta { font: 500 12px var(--f-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.meter { height: 5px; background: var(--bay); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.cap { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; font: 500 12px var(--f-mono); }
.slots { display: grid; gap: 4px; }
.slot { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 5px 8px; background: var(--bay); border-radius: 3px; font: 500 12px var(--f-mono); }
.slot.bad { color: var(--crit); }
.shop { display: grid; gap: 6px; }
.shop .btn { justify-content: space-between; padding: 7px 10px; }
.shop .btn small { display: block; font-weight: 400; color: var(--dim); font-size: 11.5px; }
.price { font: 600 12.5px var(--f-mono); white-space: nowrap; }
.chart { width: 100%; height: 120px; display: block; }

.log ol { list-style: none; margin: 0; padding: 12px 14px; display: grid; gap: 5px; height: 200px; overflow: auto; overscroll-behavior: contain; font-size: 12.5px; }
.log li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; }
.log time { font: 500 11px/1.6 var(--f-mono); color: var(--dim); }
.log li.warn span { color: var(--warn); } .log li.crit span { color: var(--crit); } .log li.good span { color: var(--ok); }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  transform: translateX(-50%); max-width: calc(100% - 32px);
  padding: 10px 16px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5); font-weight: 500;
}
.toast.bad { border-color: var(--crit); }
.toast.good { border-color: var(--ok); }

.overlay {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--scrim); backdrop-filter: blur(3px);
}
.card { width: min(540px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px; display: grid; gap: 12px; }
.card h2 { margin: 0; font: 800 24px/1.15 var(--f-display); text-transform: uppercase; text-wrap: balance; }
.card p { margin: 0; color: var(--dim); }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.card .btn { min-height: 42px; justify-content: center; }

@keyframes pulse { 50% { opacity: .7; } }

@media (max-width: 1000px) {
  .main { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .res { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: dense; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo">ЦОД <span>Магнат</span></div>
    <div class="res">
      <div class="chip"><span class="k">Счёт</span><span class="v" id="rMoney">$0</span></div>
      <div class="chip"><span class="k">За 24 часа</span><span class="v" id="rProfit">$0</span></div>
      <div class="chip"><span class="k">Репутация</span><span class="v stars" id="rRep"></span></div>
      <div class="chip date"><span class="k">Дата</span><span class="v" id="rDate">День 1, 08:00</span></div>
      <div class="chip"><span class="k">Вычисления, ядер</span><span class="v" id="rCpu">0 / 0</span></div>
      <div class="chip"><span class="k">Хранение, ТБ</span><span class="v" id="rSto">0 / 0</span></div>
      <div class="chip"><span class="k">ИИ, GPU</span><span class="v" id="rGpu">0 / 0</span></div>
      <div class="chip"><span class="k">Канал, Гбит/с</span><span class="v" id="rNet">0 / 10</span></div>
    </div>
    <div class="ctl">
      <div class="seg" role="group" aria-label="Скорость">
        <button type="button" data-act="pause" id="bPause" aria-pressed="false">II</button>
        <button type="button" data-act="speed" data-a="1" aria-pressed="true">1×</button>
        <button type="button" data-act="speed" data-a="2" aria-pressed="false">2×</button>
        <button type="button" data-act="speed" data-a="5" aria-pressed="false">5×</button>
      </div>
      <button class="btn" type="button" data-act="sound" id="bSound">Звук</button>
      <button class="btn" type="button" data-act="menu">Меню</button>
    </div>
  </header>

  <div class="status">
    <div class="goal" id="goal"></div>
    <div class="event calm" id="event"></div>
  </div>

  <main class="main">
    <section class="floor">
      <nav class="halls" id="halls" aria-label="Залы"></nav>
      <div class="hallinfo" id="hallinfo"></div>
      <div class="canvasbox" id="cbox">
        <canvas id="cv" aria-label="План зала"></canvas>
        <div class="lockcard" id="lockcard" hidden></div>
      </div>
      <div class="tools" id="tools"></div>
    </section>
    <aside class="side">
      <div class="panel">
        <nav class="tabs" id="tabs"></nav>
        <div class="tabbody" id="tab"></div>
      </div>
      <div class="panel log"><ol id="log"></ol></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const HOUR_MS = 2600;
  const SAVE_KEY = 'cod-magnat.save.v1';
  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ================= DATA =================
  const TYPES = {
    cpu: { name: 'Вычисления', unit: 'ядер', rate: 0.5 },
    sto: { name: 'Хранение', unit: 'ТБ', rate: 0.15 },
    gpu: { name: 'ИИ', unit: 'GPU', rate: 3.2 },
  };
  const MODELS = {
    b1: { name: 'Bronze 1U', type: 'cpu', cap: 10, heat: 3, kw: 0.4, price: 300, tier: 1 },
    b2: { name: 'Silver 2U', type: 'cpu', cap: 25, heat: 5, kw: 0.6, price: 900, tier: 2, req: 'silver' },
    b3: { name: 'Platinum 4U', type: 'cpu', cap: 60, heat: 8, kw: 1.0, price: 2500, tier: 3, req: 'platinum' },
    s1: { name: 'Дисковая полка', type: 'sto', cap: 40, heat: 2, kw: 0.3, price: 400, tier: 1 },
    s2: { name: 'All-flash массив', type: 'sto', cap: 150, heat: 3, kw: 0.5, price: 1800, tier: 2, req: 'flash' },
    g1: { name: 'GPU-узел', type: 'gpu', cap: 8, heat: 12, kw: 2.0, price: 4000, tier: 2, req: 'gpu' },
    g2: { name: 'GPU-кластер', type: 'gpu', cap: 32, heat: 22, kw: 4.0, price: 14000, tier: 3, req: 'gpu2' },
  };
  const RACK_SLOTS = 6;
  const BUILD = {
    rack: { name: 'Стойка', price: 200, kw: 0, short: '6 серверов', desc: 'Вмещает 6 серверов любого типа.' },
    crac: { name: 'Кондиционер', price: 800, kw: 3, cool: 30, r: 1, short: '30 · R1', desc: 'Снимает 30 ед. тепла, делится между стойками в радиусе 1 клетки.' },
    chiller: { name: 'Чиллер', price: 3500, kw: 6, cool: 95, r: 2, req: 'chiller', short: '95 · R2', desc: 'Снимает 95 ед. тепла в радиусе 2 клеток.' },
    ups: { name: 'ИБП', price: 1000, kw: 0, backup: 25, short: '25 кВт', desc: 'Держит 25 кВт нагрузки зала при отключении электричества.' },
    gen: { name: 'Дизель', price: 6000, kw: 0, backup: 150, req: 'diesel', short: '150 кВт', desc: 'Генератор держит 150 кВт при отключении.' },
    trafo: { name: 'Трансформатор', price: 2500, kw: 0, power: 60, short: '+60 кВт', desc: 'Поднимает лимит мощности зала на 60 кВт.' },
    gas: { name: 'Газовая турбина', price: 12000, kw: 0, backup: 80, gas: 80, req: 'gas', short: '80 кВт', desc: 'Вырабатывает до 80 кВт по $0,30/кВт·ч, когда сеть дороже. При отключении держит 80 кВт.' },
    heatx: { name: 'Теплообменник', price: 6000, kw: 1, cool: 20, r: 2, heatx: true, req: 'heatreuse', short: 'продаёт тепло', desc: 'Снимает 20 ед. тепла в радиусе 2 и продаёт его городской котельной. На севере тепло стоит вдвое дороже.' },
    miner: { name: 'ASIC-ферма соседей', price: 0, kw: 6, hidden: true, desc: 'Чужая майнинг-ферма. Платит $30 в час, но выдаёт 40 ед. тепла и забирает охлаждение у соседних стоек.' },
  };
  const MINER_HEAT = 40;
  const TRENDS = [
    { name: 'ИИ-бум', desc: 'Все хотят нейросети: аренда GPU дорожает.', mult: { gpu: 1.9, cpu: 1.1 }, days: 8 },
    { name: 'Стриминговые войны', desc: 'Видеосервисы скупают хранилища.', mult: { sto: 1.6 }, days: 7 },
    { name: 'Криптозима', desc: 'GPU никому не нужны, цены падают.', mult: { gpu: 0.55 }, days: 6 },
    { name: 'Ценовая война облаков', desc: 'Гиганты демпингуют: все цены вниз.', mult: { cpu: 0.75, sto: 0.75, gpu: 0.8 }, days: 5 },
    { name: 'Импортозамещение', desc: 'Госзаказчики переезжают: вычисления в цене.', mult: { cpu: 1.5 }, days: 8 },
    { name: 'Дефицит видеокарт', desc: 'GPU-серверы стоят вдвое дороже, аренда GPU ×1,4.', mult: { gpu: 1.4 }, hw: { gpu: 2 }, days: 7 },
    { name: 'Сезон распродаж', desc: 'Маркетплейсы под нагрузкой.', mult: { cpu: 1.35, sto: 1.2 }, days: 5 },

      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);

      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + d + 0.02);

  function genOffer(small) {
    const L = repLevel();
    const kinds = Object.keys(KINDS).filter((k) => (!KINDS[k].req || hasTech(KINDS[k].req)));
    if (certOn('pci')) kinds.push('bank', 'bank');
    const kind = pick(kinds);
    const K = KINDS[kind];
    let lvl = small ? 1 : clamp(L + pick([-1, 0, 0, 0, 1]), 1, 5);
    if (K.lvl) lvl = Math.max(lvl, K.lvl);
    const [a, b] = AMT[K.type][lvl - 1];
    const amount = Math.round(rand(a, b));
    const sla = K.sla || pick([95, 95, 99]);
    const crypto = S.event && S.event.type === 'crypto' && K.type === 'gpu' ? 2 : 1;
    const urgent = !small && Math.random() < 0.15;
    const pay = amount * TYPES[K.type].rate * SLA_MULT[sla] * rand(0.85, 1.25) * (1 + 0.05 * S.staff.sales) * (hasTech('peering') ? 1.15 : 1) * crypto
      * TARIFFS[S.tariff].pay * (urgent ? 2.2 : 1) * S.market[K.type] * certMult(kind, K.type, sla);
    return {
      id: S.nextId++, name: pick(CLIENTS[kind]), kind, type: K.type, amount, sla, lvl, urgent,
      pay: Math.max(1, Math.round(pay * 10) / 10),
      days: small ? 4 : urgent ? randi(1, 2) : randi(5, 10) + lvl * 2,
      expires: urgent ? randi(12, 20) : randi(60, 110),
    };
  }
  function certMult(kind, type, sla) {
    let m = 1;
    if (certOn('tier3') && sla >= 99.9) m *= 1.2;
    if (certOn('iso')) m *= 1.1;
    if (certOn('pci') && kind === 'bank') m *= 1.4;
    if (certOn('green') && (type === 'sto' || type === 'gpu')) m *= 1.2;
    return m;
  }

  function rackCap(t, hallDark) {
    const res = { cpu: 0, sto: 0, gpu: 0 };
    if (hallDark || t.fire) return res;
    const throttle = t.temp > 40 ? 0.6 : t.temp > 32 ? 0.85 : 1;
    const working = t.s.length - t.broken;
    for (let i = 0; i < working; i++) { const m = MODELS[t.s[i]]; res[m.type] += m.cap * throttle; }
    return res;
  }
  function techMult(type) {
    if (type === 'cpu') return (hasTech('virt') ? 1.2 : 1) * (hasTech('k8s') ? 1.25 : 1) * (1 + S.capBonus);
    if (type === 'sto') return hasTech('k8s') ? 1.15 : 1;
    return 1;
  }

    const H = S.halls[hi], D = HALLS[hi];

      if (t.k === 'rack') t.s.forEach((m) => { load += MODELS[m].kw; });
      else { const b = BUILD[t.k]; load += b.kw || 0; cap += b.power || 0; backup += b.backup || 0; }
    });
    return { load, cap, backup };
  }

    // halls: power
    S.halls.forEach((H, hi) => {
      if (!H.open) return;
      const st = hallStats(hi);
      H.load = st.load; H.cap = st.cap; H.backup = st.backup;
      const wasDark = H.dark;
      if (H.locked > 0 && --H.locked === 0) log(`${HALLS[hi].name}: системы восстановлены после атаки`, 'good');
      H.dark = (!!outage && st.backup < st.load) || H.locked > 0;
      if (H.dark && !wasDark && !H.locked) log(`${HALLS[hi].name}: резерва не хватило, зал обесточен`, 'crit');
    });

    // capacity
    const cap = { cpu: 0, sto: 0, gpu: 0 };
    S.halls.forEach((H) => {
      if (!H.open) return;
      H.grid.forEach((t) => { if (t && t.k === 'rack') { const c = rackCap(t, H.dark); cap.cpu += c.cpu; cap.sto += c.sto; cap.gpu += c.gpu; } });
    });
    for (const k in cap) cap[k] *= techMult(k);

    // demand
    const dem = { cpu: 0, sto: 0, gpu: 0 }, peak = { cpu: 0, sto: 0, gpu: 0 };
    S.contracts.forEach((c) => { dem[c.type] += c.amount * PROF[KINDS[c.kind].prof](S.hour); peak[c.type] += c.amount; });
    // network
    let bwDem = 0, bwCap = 0;
    S.contracts.forEach((c) => {
      const cdn = hasTech('cdn') && (c.kind === 'web' || c.kind === 'media' || c.kind === 'game') ? 0.6 : 1;
      bwDem += c.amount * BW[c.kind] * PROF[KINDS[c.kind].prof](S.hour) * cdn;
    });
    S.halls.forEach((H) => { if (H.open && !H.dark) bwCap += NET_TIERS[H.net || 0].cap; });
    if (ev && ev.type === 'ddos') {
      const shield = hasTech('antiddos') ? 0.15 : 1 - Math.min(0.6, S.staff.guard * 0.15);
      bwDem += Math.min(400, bwCap * 0.9) * shield;
    }
    const netF = bwDem > 0 ? Math.min(1, bwCap / bwDem) : 1;
    S.bw = { dem: bwDem, cap: bwCap };
    const served = {}, util = {};
    for (const k in dem) {
      served[k] = dem[k] > 0 ? Math.min(1, cap[k] / dem[k]) * netF : 1;
      if (ev && ev.type === 'fiber') served[k] *= 0.4;
      util[k] = cap[k] > 0 ? Math.min(1, dem[k] / cap[k]) : 0;
    }
    S.cap = cap; S.dem = dem; S.peak = peak; S.served = served;

    // thermal
    const heatwave = ev && ev.type === 'heat' ? 8 : 0;
    const engMult = 1 + 0.08 * S.staff.eng;
    const fail = 0.002 * (hasTech('aiops') ? 0.4 : 1);
    S.halls.forEach((H, hi) => {
      if (!H.open) return;
      const D = HALLS[hi];
      const amb = D.amb + (D.amb >= 15 ? heatwave : 0);
      const racks = [];
      H.grid.forEach((t, i) => { if (t && (t.k === 'rack' || t.k === 'miner')) { t.cool = 0; racks.push(i); } });
      if (!H.dark) {
        H.grid.forEach((t, i) => {
          if (!t || !BUILD[t.k].cool) return;
          const b = BUILD[t.k];
          const x = i % D.w, y = Math.floor(i / D.w);
          const inRange = racks.filter((j) => Math.max(Math.abs((j % D.w) - x), Math.abs(Math.floor(j / D.w) - y)) <= b.r);
          inRange.forEach((j) => { H.grid[j].cool += (b.cool * engMult) / inRange.length; });
        });
      }
      racks.forEach((i) => {
        const t = H.grid[i];
        let heat = 0;
        if (t.k === 'miner') heat = H.dark ? 0 : MINER_HEAT;
        else if (!H.dark) {
          const working = t.s.length - t.broken;
          for (let n = 0; n < working; n++) {
            const m = MODELS[t.s[n]];
            heat += m.heat * (0.3 + 0.7 * util[m.type]) * (m.type === 'gpu' && hasTech('liquid') ? 0.5 : 1);
          }
        }
        if (t.fire) heat += 30;
        t.heat = heat;
        const target = amb + heat * 0.12 + Math.max(0, heat - t.cool) * 1.2;
        t.temp += (target - t.temp) * 0.5;
        if (H.dark || t.fire) return;
        if (t.k === 'miner') { if (t.temp > 44 && !t.fire && Math.random() < 0.04) { t.fire = 5; t.fireAge = 0; log(`ПОЖАР на ASIC-ферме, клетка ${tileName(hi, i)}!`, 'crit'); Sound.alarm(); alertPause('пожар'); } return; }
        // failures (wear grows with age; engineers slow it down)
        t.age = (t.age || 0) + 1 / (1 + 0.15 * S.staff.eng);
        const p = fail * (t.temp > 32 ? 2.5 : 1) * (t.temp > 40 ? 4 : 1) * (1 + t.age / 480);
        const working = t.s.length - t.broken;
        for (let n = 0; n < working; n++) if (Math.random() < p) t.broken++;
        if (t.broken > 0 && t.broken > (t.lastBroken || 0)) log(`Сломался сервер в ${HALLS[hi].name}, стойка ${tileName(hi, i)}`, 'warn');
        t.lastBroken = t.broken;
        if (t.temp > 44 && (t.k === 'miner' || t.s.length) && Math.random() < 0.04) {
          t.fire = 5; t.fireAge = 0;
          log(`ПОЖАР! ${HALLS[hi].name}, клетка ${tileName(hi, i)}. Кликните, чтобы потушить`, 'crit');
          Sound.alarm();
          if (S.cur !== hi) toast(`Пожар: ${HALLS[hi].name}, ${tileName(hi, i)}`, 'bad');
          alertPause('пожар');
        }
      });
      // fires
      racks.forEach((i) => {
        const t = H.grid[i];
        if (!t.fire) return;
        t.fireAge++;
        if (S.staff.guard > 0 && t.fireAge >= 1) { t.fire = 0; log(`Безопасник потушил стойку ${tileName(hi, i)}`, 'good'); return; }
        if (--t.fire <= 0 && t.k === 'miner') {
          H.grid[i] = null;
          log(`ASIC-ферма соседей сгорела дотла. Соседи в ярости`, 'crit');
          Sound.crash();
          return;
        }
        if (t.fire <= 0) {
          const lost = t.s.length;
          if (S.insured && lost) {
            const pay = Math.round(t.s.reduce((a, m) => a + priceOf(m), 0) * 0.8);
            S.money += pay; S.today.other -= pay;
            log(`Страховая выплатила ${fmt$(pay)} за сгоревшую стойку`, 'good');
          }
          t.s = []; t.broken = 0; t.lastBroken = 0; t.fire = 0; t.temp = amb + 20;
          log(`Стойка ${tileName(hi, i)} сгорела: потеряно серверов ${lost}`, 'crit');
          Sound.crash();
        }
      });
    });

    // money: contracts
    let income = 0;
    const finished = [];
    S.contracts.forEach((c) => {
      const f = served[c.type];
      income += c.pay * f;
      c.ok += f; c.hrs++; c.left--;
      if (c.left <= 0) finished.push(c);
    });
    finished.forEach((c) => {
      S.contracts = S.contracts.filter((x) => x !== c);
      const up = (c.ok / c.hrs) * 100;
      if (up >= c.sla - 0.001) {
        const bonus = Math.round(c.pay * 8);
        S.money += bonus; S.today.inc += bonus;
        S.rep = Math.min(100, S.rep + (2 + c.lvl * 1.5) * TARIFFS[S.tariff].rep);
        S.stats.done++;
        log(`Контракт «${c.name}» выполнен (${up.toFixed(2)}%). Бонус ${fmt$(bonus)}`, 'good');
        Sound.coin();
        if (!c.urgent && !c.tender && Math.random() < 0.65) {
          const o = renewOffer(c);
          S.offers.unshift(o);
          log(`«${c.name}» хочет продлить контракт${o.vip ? ' (VIP-клиент)' : ''}: ${fmt$(o.pay)}/ч`, 'good');
        }
      } else {
        const fine = Math.round(c.pay * 12 * (S.insured ? 0.5 : 1));
        S.money -= fine; S.today.other += fine;
        S.rep = Math.max(0, S.rep - 4 - c.lvl * 2);
        S.stats.failed++;
        if (c.loyal) S.rep = Math.max(0, S.rep - 2 * c.loyal);
        log(`SLA нарушен: «${c.name}» (${up.toFixed(2)}% < ${c.sla}%). Штраф ${fmt$(fine)}${c.loyal ? '. Постоянный клиент ушёл и рассказал всем' : ''}`, 'crit');
        Sound.bad();
      }
    });
    income *= 1 - S.equity;
    income += S.subs;
    S.halls.forEach((H) => { if (H.open && !H.dark) H.grid.forEach((t) => { if (t && t.k === 'miner' && !t.fire) income += 30; }); });
    // heat reuse
    let heatInc = 0;
    S.halls.forEach((H, hi) => {
      if (!H.open || H.dark) return;
      const D = HALLS[hi];
      H.grid.forEach((t, i) => {
        if (!t || t.k !== 'heatx') return;
        const x = i % D.w, y = Math.floor(i / D.w);
        H.grid.forEach((r, j) => {
          if (r && (r.k === 'rack' || r.k === 'miner') && Math.max(Math.abs((j % D.w) - x), Math.abs(Math.floor(j / D.w) - y)) <= 2) heatInc += (r.heat || 0) * 0.05 * (D.amb < 15 ? 2 : 1);
        });
      });
    });
    S.heatInc = heatInc;
    income += heatInc;
    // expenses: electricity (spot/fixed tariff, own gas generation)
    const price = elecPrice();
    let elec = 0;
    S.halls.forEach((H, hi) => {
      if (!H.open || H.dark) return;
      const gasCap = H.grid.reduce((a, t) => a + (t && BUILD[t.k] && BUILD[t.k].gas ? BUILD[t.k].gas : 0), 0);
      const useGas = outage || price > GAS_FUEL ? Math.min(H.load, gasCap) : 0;
      const grid = outage ? 0 : H.load - useGas;
      H.gasUsed = useGas;
      elec += grid * price + useGas * GAS_FUEL;
    });
    S.money += income - elec;
    S.today.inc += income; S.today.elec += elec;
    S.hourly.push(income - elec);
    if (S.hourly.length > 24) S.hourly.shift();

    // reputation drift
    let allGood = true;
    for (const k in dem) if (dem[k] > 0 && served[k] < 0.98) { S.rep = Math.max(0, S.rep - (1 - served[k]) * 0.6); allGood = false; }
    if (allGood && S.contracts.length) S.rep = Math.min(100, S.rep + 0.02);

    // offers
    S.offers.forEach((o) => o.expires--);
    S.offers = S.offers.filter((o) => o.expires > 0);
    const want = 3 + S.staff.sales + (S.promo > 0 ? 3 : 0);
    const flow = 0.25 * TARIFFS[S.tariff].flow * (S.promo > 0 ? 2.5 : 1);
    if (S.offers.length < want && Math.random() < flow) S.offers.push(genOffer());
    if (S.promo > 0) S.promo--;
    if (S.sec.pentest > 0) S.sec.pentest--;
    if (S.staff.acct > 0) autoSign();
    if (S.staff.buyer > 0 && S.hour % 3 === 0) autoBuy();
    marketTick();
    tenderTick();

    // mail
    S.inbox.forEach((m) => { m.left--; });
    S.inbox.filter((m) => m.left <= 0).forEach((m) => answerMail(m, 'no', true));
    if (--S.nextMsg <= 0) {
      const ok = MSGS.map((m, i) => i).filter((i) => i !== S.lastMsg && !S.inbox.some((m) => m.i === i) && (!MSGS[i].cond || MSGS[i].cond()));
      if (ok.length && S.inbox.length < 3) {
        const i = pick(ok);
        const m = { id: S.nextId++, i, left: 30, data: MSGS[i].init ? MSGS[i].init() : {} };
        S.lastMsg = i;
        if (S.autoNo) answerMail(m, 'no', true);
        else { S.inbox.push(m); toast(`Новое письмо: ${MSGS[i].from}`); Sound.coin(); }
      }
      S.nextMsg = randi(28, 52);
    }

    // research
    if (S.research) {
      S.research.left--;
      if (S.research.left <= 0) {
        const t = TECH.find((x) => x.id === S.research.id);
        S.tech[t.id] = true; S.research = null;
        log(`Исследование завершено: ${t.name}`, 'good');
        toast(`Изучено: ${t.name}`, 'good');
        Sound.win();
      }
    }

    // staff jobs
    runJobs();

    // events
    if (ev) {
      ev.left--;
      if (ev.left <= 0) { log(`Закончилось: ${EVENTS[ev.type].name}`, 'good'); S.event = null; }
    } else if (--S.nextEvent <= 0) {
      const types = Object.keys(EVENTS).filter((k) => !EVENTS[k].skip || !hasTech(EVENTS[k].skip));
      const type = pick(types);
      const E = EVENTS[type];
      S.event = { type, left: randi(E.h[0], E.h[1]) };
      log(`${E.name}! ${E.desc}`, type === 'crypto' ? 'good' : 'crit');
      if (type !== 'crypto') { Sound.alarm(); alertPause(E.name.toLowerCase()); }
      S.nextEvent = randi(36, 84);
    }

    checkGoals();
  }

  function runJobs() {
    // drop stale jobs
    S.jobs = S.jobs.filter((j) => {
      const t = S.halls[j.h].grid[j.i];
      return t && t.k === 'rack' && (j.kind === 'fire' ? t.fire > 0 : t.broken > 0);
    });
    // progress
    S.jobs.forEach((j) => {
      j.t++;
      if (j.t >= j.travel + j.work) {
        const t = S.halls[j.h].grid[j.i];
        if (j.kind === 'fire') { t.fire = 0; log(`Админ потушил стойку ${tileName(j.h, j.i)}`, 'good'); }
        else { log(`Админ починил ${t.broken} серв. в стойке ${tileName(j.h, j.i)}`, 'good'); t.broken = 0; t.lastBroken = 0; }
        j.done = true;
      }
    });
    S.jobs = S.jobs.filter((j) => !j.done);
    // assign
    let idle = S.staff.admin - S.jobs.length;
    if (idle <= 0) return;
    const todo = [];
    S.halls.forEach((H, hi) => {
      if (!H.open) return;
      H.grid.forEach((t, i) => {
        if (!t || t.k !== 'rack') return;
        if (S.jobs.some((j) => j.h === hi && j.i === i)) return;
        if (t.fire) todo.unshift({ h: hi, i, kind: 'fire' });
        else if (t.broken) todo.push({ h: hi, i, kind: 'repair' });
      });
    });
    todo.slice(0, idle).forEach((j) => {
      const D = HALLS[j.h];
      const dist = (j.i % D.w) + Math.abs(Math.floor(j.i / D.w) - D.h / 2);
      j.travel = Math.max(1, Math.ceil(dist / 4));
      j.work = j.kind === 'fire' ? 1 : hasTech('aiops') ? 1 : 2;
      j.t = 0;
      S.jobs.push(j);
    });
  }

  function newDay() {
    S.day++;
    const sal = Object.keys(STAFF).reduce((a, k) => a + STAFF[k].pay * S.staff[k], 0);
    const rent = HALLS.reduce((a, h, i) => a + (S.halls[i].open ? h.rent : 0), 0);
    const interest = Math.round(S.loan * 0.012);
    const netFee = S.halls.reduce((a, H) => a + (H.open ? NET_TIERS[H.net || 0].fee : 0), 0);
    if (netFee) { S.money -= netFee; S.today.other += netFee; }
    S.energy.tariff = S.energy.next;
    S.energy.dayF = rand(0.8, 1.3);
    const premium = S.insured ? insurancePremium() : 0;
    if (premium) { S.money -= premium; S.today.other += premium; }
    CERTS.forEach((c) => {
      const st = S.certs[c.id];
      if (!st) return;
      const ok = c.ok();
      if (st.on && !ok) { st.on = false; log(`Сертификат ${c.name} приостановлен: ${c.need.toLowerCase()}`, 'crit'); Sound.bad(); }
      else if (!st.on && ok) { st.on = true; log(`Сертификат ${c.name} восстановлен`, 'good'); }
    });
    S.money -= sal + rent + interest;
    S.today.sal += sal; S.today.rent += rent; S.today.other += interest;
    if (interest) log(`Проценты по кредиту: ${fmt$(interest)}`);
    const d = S.today;
    const net = d.inc - d.elec - d.sal - d.rent - d.other;
    S.history.push({ inc: Math.round(d.inc), exp: Math.round(d.elec + d.sal + d.rent + d.other), net: Math.round(net) });
    if (S.history.length > 30) S.history.shift();
    S.stats.bestDay = Math.max(S.stats.bestDay, net);
    S.rivals.forEach((r) => { if (!r.bought) r.rep = Math.min(95, r.rep + rand(0, 0.7)); });
    S.mhist.push({ ...S.market });
    if (S.mhist.length > 30) S.mhist.shift();
    S.today = { inc: 0, elec: 0, sal: 0, rent: 0, other: 0 };
    log(`День ${S.day}. Вчера: ${net >= 0 ? 'прибыль' : 'убыток'} ${fmt$(net)}`, net >= 0 ? '' : 'warn');
    securityDay();
    if (S.over) return;
    ipoDay(net);
    if (S.over) return;
    if (S.money < 0) {
      S.debtDays++;
      if (S.debtDays >= 3) { gameOver(); return; }
      toast(`Счёт в минусе уже ${S.debtDays} дн. На 3-й день — банкротство`, 'bad');
      Sound.bad();
    } else S.debtDays = 0;
    save();
  }

  function checkGoals() {
    while (S.goal < GOALS.length && GOALS[S.goal].ok()) {
      const g = GOALS[S.goal];
      S.money += g.r; S.today.other -= g.r;
      log(`Цель выполнена: ${g.t}. Награда ${fmt$(g.r)}`, 'good');
      toast(`Цель выполнена! +${fmt$(g.r)}`, 'good');
      Sound.win();
      S.goal++;
      if (g.win && !S.won) { S.won = true; showOverlay('win'); }
    }
  }

  function gameOver(reason = 'bankrupt') {
    S.over = true;
    S.overReason = reason;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    Sound.crash();
    showOverlay('over');
  }

  function alertPause(what) {
    if (S.autoPause && S.started && !S.paused) {
      S.paused = true;
      toast(`Автопауза: ${what}. Продолжить — ▶ или пробел`, 'bad');
    }
  }
  function insurancePremium() {
    const eq = S.halls.reduce((a, H) => a + H.grid.reduce((b, t) => b + (t ? refund(t) * 2 : 0), 0), 0);
    return Math.round(eq * 0.004);
  }
  function valuation() {
    const assets = S.halls.reduce((a, H) => a + H.grid.reduce((b, t) => b + (t ? refund(t) * 2 : 0), 0), 0);
    const halls = S.halls.reduce((a, H, i) => a + (H.open ? HALLS[i].price * 0.5 : 0), 0);
    const yest = S.history.length ? S.history[S.history.length - 1].net : 0;
    return S.money - S.loan + assets * 0.6 + halls + Math.max(0, yest) * 30;
  }
  function loanLimit() {
    return Math.max(0, Math.floor((Math.max(5000, (valuation() + S.loan) * 0.5) - S.loan) / 1000) * 1000);
  }
  function emptyTiles() {
    const out = [];
    S.halls.forEach((H, hi) => { if (H.open) H.grid.forEach((t, i) => { if (!t) out.push([hi, i]); }); });
    return out;
  }
  function allRacks(f = () => true) {
    const out = [];
    S.halls.forEach((H, hi) => { if (H.open) H.grid.forEach((t, i) => { if (t && t.k === 'rack' && f(t)) out.push({ t, hi, i }); }); });
    return out;
  }
  const freeSlots = () => allRacks().reduce((a, r) => a + RACK_SLOTS - r.t.s.length, 0);
  const hasMiner = () => S.halls.some((H) => H.grid.some((t) => t && t.k === 'miner'));
  function minerSpot() {
    for (let hi = 0; hi < S.halls.length; hi++) {
      const H = S.halls[hi];
      if (!H.open) continue;
      const st = hallStats(hi);
      if (st.load + BUILD.miner.kw > st.cap) continue;
      const e = H.grid.findIndex((t) => !t);
      if (e >= 0) return [hi, e];
    }
    return null;
  }
  const URGENT_KIND = { cpu: 'web', sto: 'backup', gpu: 'ai' };
  const RANSOM = 0;

  const MSGS = [
    {
      from: 'Вымогатели «ByteBandits»',
      special: true,
      def: 'no',
      cond: () => false,
      text: (d) => `Ваш зал «${HALLS[d.hi].name}» зашифрован. Переведите ${fmt$(d.sum)} в биткоинах — и ключ ваш. Иначе ждите восстановления.`,
      yes: ['Заплатить выкуп', (d) => {
        if (!spend(d.sum)) return;
        if (Math.random() < 0.8) { S.halls[d.hi].locked = 1; log('Ключ получен, зал расшифровывается', 'warn'); }
        else log('Вымогатели взяли деньги и пропали. Зал всё ещё заблокирован', 'crit');
        S.rep = Math.max(0, S.rep - 2);
      }],
      no: ['Восстанавливаться самим', () => log('Восстанавливаемся из бэкапов без выкупа')],
    },
    {
      from: 'Маркетинг',
      text: () => 'Запустим рекламу у блогеров за $1 500? Двое суток клиентов будет в разы больше.',
      cond: () => S.money >= 1500 && !S.promo,
      yes: ['Запускаем', () => { if (!spend(1500)) return; S.promo = 48; log('Реклама запущена: двое суток клиентов больше', 'good'); }],
      no: ['Не сейчас', () => log('Маркетинг грустно закрыл презентацию')],
    },
    {
      from: 'Венчурный фонд «Ракета»',
      init: () => ({ sum: Math.round(Math.max(15000, valuation() * 0.15) / 1000) * 1000 }),
      text: (d) => `Дадим ${fmt$(d.sum)} за 10% компании. Взамен 10% дохода от клиентов навсегда уходит нам.`,
      cond: () => S.equity < 0.3 && S.day >= 4,
      yes: ['Берём деньги', (d) => {
        S.money += d.sum; S.today.other -= d.sum;
        S.equity = Math.round((S.equity + 0.1) * 100) / 100;
        log(`Фонд вложил ${fmt$(d.sum)}. Доля инвесторов: ${Math.round(S.equity * 100)}%`, 'good');
        Sound.coin();
      }],
      no: ['Сами справимся', () => log('Фонд пообещал вернуться')],
    },
    {
      from: 'Стажёр Петя',
      text: () => 'Дай root на прод, я только посмотрю! Честно-честно.',

  function signOffer(o, auto) {
    S.offers = S.offers.filter((x) => x !== o);
    S.contracts.push({ ...o, left: o.days * 24, ok: 0, hrs: 0 });
    S.stats.signed++;
    log(`${auto ? 'Менеджер подписал' : 'Подписан'} контракт: «${o.name}», ${fmtN(o.amount)} ${TYPES[o.type].unit}`, 'good');
    Sound.coin();
  }
  function autoSign() {
    const L = repLevel();
    const spare = {};
    for (const k in S.cap) spare[k] = S.cap[k] - S.peak[k];
    S.offers.filter((o) => o.lvl <= L).sort((a, b) => b.pay / b.amount - a.pay / a.amount).forEach((o) => {
      if (spare[o.type] >= o.amount * 1.1) { spare[o.type] -= o.amount; signOffer(o, true); }
    });
  }

  // ----- energy -----
  function spotPrice(h) {
    const curve = h < 6 ? 0.6 : h < 9 ? 0.9 : h < 18 ? 1.15 : h < 22 ? 1.5 : 0.9;
    const heat = S.event && S.event.type === 'heat' ? 1.6 : 1;
    return 0.4 * curve * S.energy.dayF * heat;
  }
  function elecPrice(h = S.hour) {
    return (S.energy.tariff === 'fixed' ? FIXED_PRICE : spotPrice(h)) * (hasTech('solar') ? 0.65 : 1);
  }

  // ----- security -----
  const revenue24 = () => S.hourly.reduce((a, b) => a + Math.max(0, b), 0);
  const threat = () => clamp(5 + revenue24() / 400 + S.rep / 4, 0, 100);
  const defense = () => clamp(10 * S.staff.guard + 15 * S.staff.soc + (hasTech('antiddos') ? 10 : 0) + (hasTech('ngfw') ? 20 : 0) + (hasTech('zerotrust') ? 30 : 0) + (S.sec.pentest > 0 ? 20 : 0), 0, 100);
  const attackChance = () => clamp(0.04 + (threat() - defense()) / 120, 0.02, 0.5);
  function securityDay() {
    if (S.day < 5 || Math.random() >= attackChance()) return;
    const th = threat();
    const types = ['insider', 'leak'];
    if (th >= 30) types.push('ransom', 'ransom');
    const type = pick(types);
    if (type === 'insider') {
      const sum = Math.round(Math.min(Math.max(0, S.money) * 0.05, 20000));
      if (!sum) return;
      S.money -= sum; S.today.other += sum;
      log(`Инсайдер вывел со счёта ${fmt$(sum)}. Усильте защиту`, 'crit');
    } else if (type === 'leak') {
      const fine = Math.round(Math.max(300, revenue24() * 1.5) * (hasTech('offbackup') ? 0.5 : 1) * (S.insured ? 0.5 : 1));
      S.money -= fine; S.today.other += fine;
      S.rep = Math.max(0, S.rep - 6);
      log(`Утечка данных клиентов! Штраф регулятора ${fmt$(fine)}, репутация −6`, 'crit');
    } else {
      const halls = S.halls.map((H, i) => i).filter((i) => S.halls[i].open && !S.halls[i].locked && S.halls[i].grid.some((t) => t && t.k === 'rack' && t.s.length));
      if (!halls.length) return;
      const hi = pick(halls);
      S.halls[hi].locked = hasTech('offbackup') ? 12 : 48;
      const sum = Math.round(Math.max(5000, revenue24() * 2) / 100) * 100;
      S.inbox.unshift({ id: S.nextId++, i: RANSOM, left: 8, data: { hi, sum } });
      log(`Шифровальщик заблокировал «${HALLS[hi].name}» на ${S.halls[hi].locked} ч. Вымогатели ждут ответа в почте`, 'crit');
      toast('Атака шифровальщика! Смотрите почту', 'bad');
    }
    Sound.alarm();
    alertPause('кибератака');
  }

  // ----- IPO -----
  function ipoDay(net) {
    const I = S.ipo;
    if (!I) return;
    I.qProfit += net;
    I.price = Math.max(1, I.price * (1 + rand(-0.02, 0.025) + (net > 0 ? 0.004 : -0.006)));
    I.hist.push(Math.round(I.price * 10) / 10);
    if (I.hist.length > 90) I.hist.shift();
    if (S.day - I.qStart < 30) return;
    if (I.qProfit >= I.target) {
      const g = clamp(I.qProfit / I.target - 1, 0, 1);
      I.price *= 1.05 + g * 0.5;
      I.misses = 0;
      S.rep = Math.min(100, S.rep + 3);
      log(`Квартал закрыт: прибыль ${fmt$(I.qProfit)} при плане ${fmt$(I.target)}. Акции растут`, 'good');
      Sound.win();
    } else {
      I.price *= 0.75;
      I.misses++;
      log(`Квартал провален: ${fmt$(I.qProfit)} при плане ${fmt$(I.target)}. Акции −25%. Промахов подряд: ${I.misses}`, 'crit');
      Sound.bad();
      if (I.misses >= 2) { gameOver('board'); return; }
      toast('Ещё один провальный квартал — и совет директоров вас уволит', 'bad');
    }
    I.target = Math.round(Math.max(I.qProfit, I.target) * 1.1);
    I.qStart = S.day; I.qProfit = 0;
  }

  // ----- renewals -----
  function renewOffer(c) {
    const loyal = (c.loyal || 0) + 1;
    const vip = loyal >= 3;
    const amount = Math.round(c.amount * rand(1, 1.3));
    const pay = Math.round((c.pay / c.amount) * amount * (vip ? 1.3 : 1.12) * 10) / 10;
    return { id: S.nextId++, name: c.name, kind: c.kind, type: c.type, amount, sla: c.sla, lvl: Math.min(c.lvl, repLevel()), pay, days: c.days, expires: 48, renew: true, loyal, vip };
  }

  // ----- market -----
  const hwMult = (type) => S.hw[type];
  const priceOf = (m) => Math.round(MODELS[m].price * hwMult(MODELS[m].type));
  const sellOf = (m) => Math.round(priceOf(m) * 0.5);
  function bumpHw(m, n = 1) { const t = MODELS[m].type; S.hw[t] = Math.min(2.5, S.hw[t] + 0.004 * MODELS[m].tier * n); }
  function marketTick() {
    for (const k of ['cpu', 'sto', 'gpu']) {
      const tgt = (S.trend && S.trend.mult[k]) || 1;
      S.market[k] = clamp(S.market[k] + (tgt - S.market[k]) * 0.03 + rand(-0.008, 0.008), 0.4, 2.5);
      const hwT = (0.65 + 0.35 * S.market[k]) * ((S.trend && S.trend.hw && S.trend.hw[k]) || 1);
      S.hw[k] = clamp(S.hw[k] + (hwT - S.hw[k]) * 0.02 + rand(-0.005, 0.005), 0.4, 2.5);
    }
    if (S.trend) {
      if (--S.trend.left <= 0) { log(`Рынок: «${S.trend.name}» закончился`); S.trend = null; }
    } else if (--S.nextTrend <= 0) {
      const T = pick(TRENDS);
      S.trend = { ...T, left: T.days * 24 };
      log(`Рынок: ${T.name}. ${T.desc}`, 'warn');
      toast(`Рынок: ${T.name}`);
      S.nextTrend = randi(5, 9) * 24;
    }
  }

  // ----- tenders & rivals -----
  function tenderTick() {
    const T = S.tender;
    if (T) {
      if (--T.left <= 0) resolveTender();
    } else if (--S.nextTender <= 0) {
      const L = repLevel();
      const lvl = Math.min(5, L + 1);
      const kinds = Object.keys(KINDS).filter((k) => !KINDS[k].req || hasTech(KINDS[k].req));
      const kind = pick(kinds), type = KINDS[kind].type;
      const gov = certOn('gov') && Math.random() < 0.5;
      const amount = Math.round(AMT[type][lvl - 1][1] * rand(0.8, 1.4) * (gov ? 1.5 : 1));
      const sla = gov ? 99.9 : pick([99, 99, 99.9]);
      const base = Math.round(amount * TYPES[type].rate * SLA_MULT[sla] * S.market[type] * 1.15 * (gov ? 1.5 : 1) * certMult(kind, type, sla) * 10) / 10;
      const name = gov ? pick(['Госуслуги Тридевятого царства', 'Минцифры Лукоморья', 'Электронный архив Кощеева ведомства']) : pick(CLIENTS[kind]);
      S.tender = { id: S.nextId++, name, kind, type, amount, sla, lvl, base, days: randi(20, 30) + (gov ? 10 : 0), left: 36, bid: null, gov };
      log(`Объявлен тендер: «${S.tender.name}», ${fmtN(amount)} ${TYPES[type].unit} на ${S.tender.days} дн.`, 'warn');
      toast('Новый тендер! Вкладка «Тендеры»');
      S.nextTender = randi(80, 130);
    }
  }
  const scoreOf = (bid, rep) => bid / (0.6 + rep / 125);
  function resolveTender() {
    const T = S.tender;
    S.tender = null;
    const field = S.rivals.filter((r) => !r.bought).map((r) => ({ name: r.name, r, bid: rand(0.8, 1.15) }));
    field.forEach((f) => { f.score = scoreOf(f.bid, f.r.rep); });
    if (T.bid) field.push({ name: 'Вы', me: true, bid: T.bid, score: scoreOf(T.bid, S.rep) });
    if (!field.length) return;
    field.sort((a, b) => a.score - b.score);
    const win = field[0];
    if (win.me) {
      const pay = Math.round(T.base * T.bid * 10) / 10;
      S.contracts.push({ id: S.nextId++, name: T.name, kind: T.kind, type: T.type, amount: T.amount, sla: T.sla, lvl: T.lvl, pay, days: T.days, left: T.days * 24, ok: 0, hrs: 0, tender: true });
      S.stats.tenders++; S.stats.signed++;
      S.rep = Math.min(100, S.rep + 3);
      log(`Тендер выигран: «${T.name}» на ${T.days} дн., ${fmt$(pay)}/ч. Готовьте мощности!`, 'good');
      toast('Тендер выигран!', 'good');
      Sound.win();
    } else {
      win.r.rep = Math.min(95, win.r.rep + 2);
      log(`Тендер «${T.name}» выиграл ${win.name}${T.bid ? '' : ' (вы не участвовали)'}`, T.bid ? 'warn' : '');
    }
    S.tlog.unshift({ name: T.name, winner: win.name, me: !!win.me });
    S.tlog.length = Math.min(S.tlog.length, 5);
  }
  const rivalPrice = (r) => Math.round((40000 + r.rep * r.rep * 140) / 1000) * 1000;

  // ----- procurement -----
  function bestModel(type) {
    return Object.keys(MODELS).filter((k) => MODELS[k].type === type && (!MODELS[k].req || hasTech(MODELS[k].req))).sort((a, b) => MODELS[b].cap - MODELS[a].cap)[0];
  }
  function findSlot(kw) {
    let best = null;
    S.halls.forEach((H, hi) => {
      if (!H.open || H.dark) return;
      const st = hallStats(hi);
      if (st.load + kw > st.cap) return;
      H.grid.forEach((t, i) => {
        if (!t || t.k !== 'rack' || t.fire || t.s.length >= RACK_SLOTS || t.temp > 34) return;
        if (!best || t.temp < best.t.temp) best = { hi, i, t };
      });
    });
    return best;
  }
  function findRackSpot(kw) {
    let best = null;
    S.halls.forEach((H, hi) => {
      if (!H.open) return;
      const D = HALLS[hi];
      const st = hallStats(hi);
      if (st.load + kw > st.cap) return;
      H.grid.forEach((t, i) => {
        if (t) return;
        const x = i % D.w, y = Math.floor(i / D.w);
        let score = 0;
        H.grid.forEach((c, j) => {
          const b = c && BUILD[c.k];
          if (!b || !b.cool) return;
          const cx = j % D.w, cy = Math.floor(j / D.w);
          if (Math.max(Math.abs(cx - x), Math.abs(cy - y)) > b.r) return;
          let n = 1;
          H.grid.forEach((r, k) => { if (r && (r.k === 'rack' || r.k === 'miner') && Math.max(Math.abs((k % D.w) - cx), Math.abs(Math.floor(k / D.w) - cy)) <= b.r) n++; });
          score += b.cool / n;
        });
        if (score >= 12 && (!best || score > best.score)) best = { hi, i, score };
      });
    });
    return best && [best.hi, best.i];
  }
  let buyerWarned = 0;
  function autoBuy() {
    const P = S.policy;
    let bought = 0, racks = 0, blocked = false;
    for (const type of ['cpu', 'sto', 'gpu']) {
      if (!S.peak[type]) continue;
      const m = bestModel(type);
      if (!m) continue;
      const M = MODELS[m];
      let need = S.peak[type] * (1 + P.headroom) - S.cap[type];
      while (need > 0 && bought < 10) {
        const price = priceOf(m);
        if (S.money - price < P.reserve) break;
        let slot = findSlot(M.kw);
        if (!slot && P.racks) {
          const sp = findRackSpot(M.kw);
          if (sp && S.money - price - BUILD.rack.price >= P.reserve) {
            S.halls[sp[0]].grid[sp[1]] = mkRack();
            S.money -= BUILD.rack.price; S.today.other += BUILD.rack.price;
            racks++;
            slot = { hi: sp[0], i: sp[1], t: S.halls[sp[0]].grid[sp[1]] };
          }
        }
        if (!slot) { blocked = true; break; }
        slot.t.s.splice(slot.t.s.length - slot.t.broken, 0, m);
        S.money -= price; S.today.other += price;
        bumpHw(m);
        refreshHall(slot.hi);
        need -= M.cap * techMult(type);
        bought++;
      }
    }
    if (bought) log(`Завхоз докупил серверов: ${bought}${racks ? `, поставил стоек: ${racks}` : ''}`);
    if (blocked && S.day > buyerWarned) { buyerWarned = S.day; log('Завхоз: некуда ставить серверы — нужны кондиционеры, трансформаторы или новый зал', 'warn'); }
  }

  // ----- mail -----
  function answerMail(m, a, silent) {
    S.inbox = S.inbox.filter((x) => x !== m);
    const M = MSGS[m.i];
    if (silent) a = M.def || 'no';
    log(silent ? `${M.from}: без ответа (${M[a][0].toLowerCase()})` : `Вы → ${M.from}: «${M[a][0]}»`);
    M[a][1](m.data);
  }

  // ----- bulk -----
  function hallServerCount(hi, model) {
    return S.halls[hi].grid.reduce((a, t) => a + (t && t.k === 'rack' ? t.s.filter((x) => x === model).length : 0), 0);
  }
  function fillRacks(list, hi, m) {
    let n = 0;
    const M = MODELS[m];
    for (const t of list) {
      while (t.s.length < RACK_SLOTS) {
        const st = hallStats(hi);
        if (st.load + M.kw > st.cap) { if (!n) toast('Не хватает мощности зала. Поставьте трансформатор', 'bad'); return n; }
        if (S.money < priceOf(m)) { if (!n) toast('Не хватает денег', 'bad'); return n; }
        S.money -= priceOf(m); S.today.other += priceOf(m);
        bumpHw(m);
        t.s.splice(t.s.length - t.broken, 0, m);
        n++;
      }
    }
    return n;
  }

  // ================= ACTIONS =================
  function spend(v) {
    if (S.money < v) { toast(`Не хватает денег: нужно ${fmt$(v)}`, 'bad'); Sound.bad(); return false; }
    S.money -= v; S.today.other += v;
    return true;
  }
  function selTile() { return S.sel ? S.halls[S.sel.h].grid[S.sel.i] : null; }

  function place(kind, h, i) {
    const H = S.halls[h];
    if (H.grid[i]) return false;
    const b = BUILD[kind];
    if (!b || b.hidden) return false;
    if (b.req && !hasTech(b.req)) { toast('Сначала изучите технологию', 'bad'); return false; }
    const st = hallStats(h);
    if (b.kw && st.load + b.kw > st.cap) { toast('Не хватает мощности зала. Поставьте трансформатор', 'bad'); Sound.bad(); return false; }
    if (!spend(b.price)) return false;
    H.grid[i] = kind === 'rack' ? mkRack() : { k: kind };
    Sound.build();
    refreshHall(h);
    return true;
  }
  function refreshHall(h) { const st = hallStats(h); Object.assign(S.halls[h], { load: st.load, cap: st.cap, backup: st.backup }); }

  function refund(t) {
    if (t.k === 'rack') return BUILD.rack.price * 0.5 + t.s.reduce((a, m) => a + sellOf(m), 0);
    return BUILD[t.k].price * 0.5;
  }

  const ACT = {
    pause() { S.paused = !S.paused; },
    speed(a) { S.speed = Number(a); S.paused = false; },
    sound() { Sound.init(); Sound.on = !Sound.on; },
    menu() { S.paused = true; showOverlay('menu'); },
    resume() { $('#overlay').hidden = true; S.paused = false; },
    save() { save(); toast('Игра сохранена', 'good'); },
    reset() { showOverlay('confirm'); },
    newgame() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} newState(); S.started = true; $('#overlay').hidden = true; afterLoad(); log('Вы открыли свою первую серверную в каморке под лестницей'); },
    cont() { S.started = true; S.paused = false; $('#overlay').hidden = true; },
    keep() { $('#overlay').hidden = true; S.paused = false; },
    tool(a) { S.tool = S.tool === a ? 'select' : a; },
    view(a) { S.view = a; },
    autopause() { S.autoPause = !S.autoPause; showOverlay('menu'); },
    tariff(a) { S.tariff = Number(a); log(`Тарифы: ${TARIFFS[S.tariff].name}. Новые предложения пойдут по новым ценам`); },
    loan(a) {
      const v = Number(a);
      if (v > loanLimit()) { toast('Банк не даст столько', 'bad'); return; }
      S.loan += v; S.money += v;
      log(`Взят кредит ${fmt$(v)} под 1,2% в день`, 'warn');
      Sound.coin();
    },
    repay(a) {
      const v = Math.min(S.loan, a === 'all' ? S.loan : Number(a));
      if (!v) return;
      if (S.money < v) { toast('Не хватает денег', 'bad'); return; }
      S.money -= v; S.loan -= v;
      log(`Погашено ${fmt$(v)} кредита`, 'good');
    },
    tab(a) { S.tab = a; },
    hall(a) { S.cur = Number(a); S.sel = null; layoutCanvas(); },
    openhall(a) {
      const i = Number(a), D = HALLS[i];
      if (repLevel() < D.lvl) { toast(`Нужна репутация ${'★'.repeat(D.lvl)}`, 'bad'); return; }
      if (!spend(D.price)) return;
      S.halls[i].open = true;
      log(`Арендован зал: ${D.name}`, 'good');
      Sound.win();
      refreshHall(i);
    },
    build(a) { if (S.sel) place(a, S.sel.h, S.sel.i); },
    addsrv(a) {
      const t = selTile(); const m = MODELS[a];
      if (!t || t.k !== 'rack' || t.s.length >= RACK_SLOTS) return;
      const st = hallStats(S.sel.h);
      if (st.load + m.kw > st.cap) { toast('Не хватает мощности зала. Поставьте трансформатор', 'bad'); Sound.bad(); return; }
      if (!spend(priceOf(a))) return;
      bumpHw(a);
      t.s.splice(t.s.length - t.broken, 0, a);
      Sound.build();
      refreshHall(S.sel.h);
    },
    fillrack(a) {
      const t = selTile();
      if (!t || t.k !== 'rack') return;
      const n = fillRacks([t], S.sel.h, a);
      if (n) { Sound.build(); refreshHall(S.sel.h); }
    },
    fillhall(a) {
      const list = S.halls[S.cur].grid.filter((t) => t && t.k === 'rack' && !t.fire);
      const n = fillRacks(list, S.cur, a);
      if (n) { Sound.build(); refreshHall(S.cur); log(`Зал заполнен: +${n} × ${MODELS[a].name}`); }
    },
    upghall(a) {
      const [from, to] = a.split('>');
      const cost = priceOf(to) - sellOf(from);
      let n = 0;
      for (const t of S.halls[S.cur].grid) {
        if (!t || t.k !== 'rack') continue;
        for (let k = 0; k < t.s.length - t.broken; k++) {
          if (t.s[k] !== from) continue;
          const st = hallStats(S.cur);
          if (st.load - MODELS[from].kw + MODELS[to].kw > st.cap || S.money < cost) break;
          S.money -= cost; S.today.other += cost;
          bumpHw(to);
          t.s[k] = to; n++;
        }
      }
      refreshHall(S.cur);
      if (n) { Sound.build(); log(`Модернизация: ${n} × ${MODELS[from].name} → ${MODELS[to].name}`, 'good'); }
      else toast('Не хватает денег или мощности', 'bad');
    },
    maintain() {
      const racks = S.halls[S.cur].grid.filter((t) => t && t.k === 'rack');
      const cost = racks.reduce((a, t) => a + t.s.length, 0) * 40;
      if (!spend(cost)) return;
      racks.forEach((t) => { t.age = 0; });
      log(`Профилактика в зале «${HALLS[S.cur].name}»: износ сброшен`, 'good');
      Sound.coin();
    },
    cert(a) {
      const c = CERTS.find((x) => x.id === a);
      if (!c || S.certs[a]) return;
      if (!c.ok()) { toast(`Не выполнено: ${c.need}`, 'bad'); return; }
      if (!spend(c.price)) return;
      S.certs[a] = { on: true };
      log(`Получен сертификат ${c.name}`, 'good');
      Sound.win();
    },
    tariffE(a) { S.energy.next = a; log(`С завтрашнего дня тариф на электричество: ${a === 'fixed' ? 'фиксированный' : 'биржевой'}`); },
    netup(a) {
      const H = S.halls[Number(a)];
      const nx = (H.net || 0) + 1;
      if (!NET_TIERS[nx] || !spend(NET_TIERS[nx].price)) return;
      H.net = nx;
      log(`Канал в «${HALLS[Number(a)].name}» расширен до ${NET_TIERS[nx].name}`, 'good');
      Sound.build();
    },
    pentest() {
      const cost = 2000 * repLevel();
      if (S.sec.pentest > 0 || !spend(cost)) return;
      S.sec.pentest = 168;
      log(`Пентест проведён: защита +20 на неделю`, 'good');
    },
    ipo() {
      if (S.ipo || valuation() < 2e6 || S.rep < 70) return;
      const cash = Math.round(valuation() * 0.25);
      S.money += cash; S.today.other -= cash;
      S.equity = Math.min(0.7, S.equity + 0.25);
      const last = S.history.reduce((a, d) => a + d.net, 0);
      S.ipo = { price: 100, hist: [100], qStart: S.day, qProfit: 0, target: Math.round(Math.max(20000, last * 1.1)), misses: 0 };
      log(`IPO! Компания на бирже, привлечено ${fmt$(cash)}. План на квартал: ${fmt$(S.ipo.target)}`, 'good');
      Sound.win();
    },
    insure() { S.insured = !S.insured; log(S.insured ? 'Оборудование застраховано' : 'Страховка отменена'); },
    promoBuy() {
      const cost = 1000 * repLevel();
      if (S.promo) return;
      if (!spend(cost)) return;
      S.promo = 48;
      log(`Рекламная кампания на двое суток за ${fmt$(cost)}`, 'good');
    },
    repairhall() {
      let n = 0;
      for (const t of S.halls[S.cur].grid) {
        if (!t || t.k !== 'rack' || !t.broken) continue;
        const cost = t.s.slice(t.s.length - t.broken).reduce((a, m) => a + 80 * MODELS[m].tier, 0);
        if (S.money < cost) break;
        S.money -= cost; S.today.other += cost;
        n += t.broken; t.broken = 0; t.lastBroken = 0;
      }
      if (n) { Sound.coin(); log(`Починено серверов: ${n}`, 'good'); }
    },
    bid(a) { if (S.tender) S.tender.bid = a === 'off' ? null : Number(a); },
    buyrival(a) {
      const r = S.rivals[Number(a)];
      if (!r || r.bought) return;
      const price = rivalPrice(r);
      if (!spend(price)) return;
      r.bought = true;
      const inc = Math.round((price / (24 * 25)) * 10) / 10;
      S.subs += inc;
      S.rep = Math.min(100, S.rep + 5);
      log(`Поглощена компания ${r.name}. Её клиенты приносят ${fmt$(inc)}/ч`, 'good');
      Sound.win();
    },
    policy(a) {
      const [k, v] = a.split(':');
      S.policy[k] = k === 'racks' ? v === '1' : Number(v);
    },
    mailans(a) {
      const [id, ans] = a.split(':');
      const m = S.inbox.find((x) => x.id === Number(id));
      if (m) answerMail(m, ans);
    },
    autono() { S.autoNo = !S.autoNo; if (S.autoNo) [...S.inbox].forEach((m) => answerMail(m, 'no', true)); },
    sellsrv(a) {
      const t = selTile(); const n = Number(a);
      if (!t || !t.s[n]) return;
      const isBroken = n >= t.s.length - t.broken;
      const back = isBroken ? Math.round(priceOf(t.s[n]) * 0.1) : sellOf(t.s[n]);
      t.s.splice(n, 1);
      if (isBroken) t.broken--;
      S.money += back;
      refreshHall(S.sel.h);
    },
    repair() {
      const t = selTile();
      if (!t || !t.broken) return;
      const cost = t.s.slice(t.s.length - t.broken).reduce((a, m) => a + 80 * MODELS[m].tier, 0);
      if (!spend(cost)) return;
      t.broken = 0; t.lastBroken = 0;
      Sound.coin();
      log(`Стойка ${tileName(S.sel.h, S.sel.i)} починена вручную`, 'good');
    },
    extinguish() { const t = selTile(); if (t && t.fire) { t.fire = 0; Sound.coin(); log('Пожар потушен вручную', 'good'); } },
    demolish() {
      const t = selTile(); if (!t) return;
      const back = refund(t);
      S.money += back;
      S.halls[S.sel.h].grid[S.sel.i] = null;
      refreshHall(S.sel.h);
      toast(`Демонтировано, возврат ${fmt$(back)}`);
    },
    sign(a) {
      const o = S.offers.find((x) => x.id === Number(a)); if (!o) return;
      if (repLevel() < o.lvl) { toast(`Клиенту нужна репутация ${'★'.repeat(o.lvl)}`, 'bad'); return; }
      signOffer(o, false);
    },
    cancel(a) {
      const c = S.contracts.find((x) => x.id === Number(a)); if (!c) return;
      const fine = Math.round(c.pay * 24);
      S.money -= fine; S.today.other += fine;
      S.rep = Math.max(0, S.rep - 3);
      S.contracts = S.contracts.filter((x) => x !== c);
      log(`Контракт «${c.name}» расторгнут. Неустойка ${fmt$(fine)}`, 'warn');
    },
    reject(a) { S.offers = S.offers.filter((x) => x.id !== Number(a)); },
    hire(a) {
      const R = STAFF[a];
      if (R.max && S.staff[a] >= R.max) return;
      if (S.money < R.pay) { toast('Нужно хотя бы на первую зарплату', 'bad'); return; }
      S.staff[a]++;
      Sound.click();
      log(`Нанят: ${R.name}`);
    },
    fireStaff(a) { if (S.staff[a] > 0) { S.staff[a]--; log(`Уволен: ${STAFF[a].name}`); } },
    research(a) {
      if (S.research) return;
      const t = TECH.find((x) => x.id === a);
      if (!spend(t.price)) return;
      S.research = { id: t.id, left: Math.round(t.days * 24), total: Math.round(t.days * 24) };
      log(`Начато исследование: ${t.name}`);
    },
  };

  // ================= RENDER: UI =================
  let logDirty = true;
  let pressing = false;
  const last = {};
  function setHTML(id, html) { if (last[id] !== html) { $(id).innerHTML = html; last[id] = html; } }

  function renderUI() {
    const m = $('#rMoney');
    m.textContent = fmt$(S.money);
    m.className = `v ${S.money < 0 ? 'neg' : ''}`;
    const p24 = S.hourly.reduce((a, b) => a + b, 0);
    const pr = $('#rProfit');
    pr.textContent = `${p24 >= 0 ? '+' : ''}${fmt$(p24)}`;
    pr.className = `v ${p24 >= 0 ? 'pos' : 'neg'}`;
    const L = repLevel();
    $('#rRep').innerHTML = `${'★'.repeat(L)}<i>${'★'.repeat(5 - L)}</i> <small class="meta">${Math.round(S.rep)}</small>`;
    $('#rDate').textContent = `День ${S.day}, ${clock()}`;
    for (const k of ['cpu', 'sto', 'gpu']) {
      const el = $(`#r${k[0].toUpperCase()}${k.slice(1)}`);
      el.textContent = `${fmtN(S.dem[k])} / ${fmtN(S.cap[k])}`;
      el.className = `v ${S.dem[k] > 0 && S.served[k] < 0.98 ? 'neg' : ''}`;
    }
    const rn = $('#rNet');
    rn.textContent = `${fmtN(S.bw.dem)} / ${fmtN(S.bw.cap)}`;
    rn.className = `v ${S.bw.dem > S.bw.cap ? 'neg' : ''}`;
    $('#bPause').setAttribute('aria-pressed', String(S.paused));
    $('#bPause').textContent = S.paused ? '▶' : 'II';
    document.querySelectorAll('[data-act="speed"]').forEach((b) => b.setAttribute('aria-pressed', String(!S.paused && Number(b.dataset.a) === S.speed)));
    $('#bSound').textContent = Sound.on ? 'Звук: вкл' : 'Звук: выкл';

    const g = GOALS[S.goal];
    setHTML('#goal', g ? `<b>Цель ${S.goal + 1}/${GOALS.length}</b><span>${g.t}</span><em>+${fmt$(g.r)}</em>` : `<b>Все цели</b><span>Вы построили империю дата-центров. Можно продолжать расти.</span>`);

    const ev = S.event;
    const evBox = $('#event');
    if (ev) {
      const E = EVENTS[ev.type];
      evBox.className = `event ${E.cls}`;
      setHTML('#event', `<strong>${E.name}</strong><span>${E.desc}</span><b class="left">ещё ${ev.left} ч</b>`);
    } else {
      evBox.className = 'event calm';
      setHTML('#event', '<strong>Всё спокойно</strong><span>Аварий нет. Самое время строиться.</span>');
    }

    // halls nav
    setHTML('#halls', HALLS.map((D, i) => {
      const H = S.halls[i];
      let sub;
      if (!H.open) sub = `${fmt$(D.price)} · ${'★'.repeat(D.lvl)}`;
      else {
        const alarm = H.grid.some((t) => t && t.k === 'rack' && (t.fire || t.temp > 40)) || H.dark;
        sub = alarm ? 'тревога' : `${H.grid.filter((t) => t && t.k === 'rack').length} стоек`;
      }
      const alarm = H.open && sub === 'тревога';
      return `<button type="button" data-act="hall" data-a="${i}" aria-pressed="${S.cur === i}" class="${H.open ? '' : 'locked'} ${alarm ? 'alarm' : ''}" title="${D.name}"><span>${D.name}</span><small>${sub}</small></button>`;
    }).join(''));

    const H = S.halls[S.cur], D = HALLS[S.cur];
    if (H.open) {
      refreshHall(S.cur);
      setHTML('#hallinfo', `${H.locked ? `<span class="over"><b class="over">ЗАШИФРОВАН · ${H.locked} ч</b></span>` : ''}<span>Мощность <b class="${H.load > H.cap * 0.9 ? 'over' : ''}">${H.load.toFixed(1)} / ${H.cap} кВт</b></span><span>Канал <b>${NET_TIERS[H.net || 0].name}</b></span><span>Резерв <b class="${H.backup < H.load ? 'over' : ''}">${H.backup} кВт</b></span><span>Воздух <b>${D.amb} °C</b></span><span>Аренда <b>${fmt$(D.rent)}/день</b></span>`);
    } else setHTML('#hallinfo', `<span>Зал ${D.w}×${D.h} клеток · ${D.kw} кВт · воздух ${D.amb} °C · аренда ${fmt$(D.rent)}/день</span>`);
    const lock = $('#lockcard');
    if (!H.open) {
      lock.hidden = false;
      const can = repLevel() >= D.lvl;
      setHTML('#lockcard', `<h3>${D.name}</h3><p>${D.w}×${D.h} клеток, ${D.kw} кВт, воздух ${D.amb} °C</p><p>Требуется репутация ${'★'.repeat(D.lvl)}${can ? '' : ' (пока не хватает)'}</p><div><button class="btn primary" type="button" data-act="openhall" data-a="${S.cur}" ${can && S.money >= D.price ? '' : 'disabled'}>Арендовать за ${fmt$(D.price)}</button></div>`);
    } else lock.hidden = true;


    // tools
    const tools = [['select', 'Выбор', 'осмотр'], ...Object.keys(BUILD).filter((k) => !BUILD[k].hidden).map((k) => [k, BUILD[k].name, `${fmt$(BUILD[k].price)} · ${BUILD[k].short}`, BUILD[k].req]), ['demolish', 'Снести', 'возврат 50%']];
    setHTML('#tools', tools.map(([k, n, s, req]) => `<button class="btn" type="button" data-act="tool" data-a="${k}" aria-pressed="${S.tool === k}" ${req && !hasTech(req) ? 'disabled title="Нужно исследование"' : ''}>${n}<small>${s}</small></button>`).join('') +
      `<span class="sep"></span><div class="seg" role="group" aria-label="Слой">${[['normal', 'Обычный'], ['heat', 'Тепло'], ['power', 'Питание']].map(([k, n]) => `<button type="button" data-act="view" data-a="${k}" aria-pressed="${S.view === k}">${n}</button>`).join('')}</div>`);

    // tabs
    const tabs = [['obj', 'Объект'], ['deals', `Контракты<sup>${S.offers.length}</sup>`], ['tender', `Тендеры${S.tender && !S.tender.bid ? '<sup>!</sup>' : ''}`], ['mail', `Почта${S.inbox.length ? `<sup>${S.inbox.length}</sup>` : ''}`],
      ['infra', 'Инфра'], ['staff', 'Персонал'], ['tech', 'Развитие'], ['fin', 'Финансы'], ['goals', 'Цели']];
    setHTML('#tabs', tabs.map(([k, n]) => `<button type="button" data-act="tab" data-a="${k}" aria-pressed="${S.tab === k}">${n}</button>`).join(''));
    if (!pressing) setHTML('#tab', TAB[S.tab]());

    if (logDirty) { $('#log').innerHTML = S.log.map((e) => `<li class="${e.lvl}"><time>${e.t}</time><span>${e.msg}</span></li>`).join(''); logDirty = false; }
  }

  const typeTag = (t) => `<span class="tag ${t}">${TYPES[t].name}</span>`;
  const capRow = (k) => {
    const c = S.cap[k], d = S.peak[k];
    const pct = c ? Math.min(100, (d / c) * 100) : d ? 100 : 0;
    const col = d > c ? 'var(--crit)' : pct > 85 ? 'var(--warn)' : 'var(--ok)';
    return `<div class="cap"><span>${TYPES[k].name}</span><div class="meter"><i style="width:${pct}%;background:${col}"></i></div><span>${fmtN(d)} / ${fmtN(c)}</span></div>`;
  };

  function marketHtml() {
    const spark = (k) => {
      const pts = S.mhist.map((m) => m[k]).concat([S.market[k]]);
      if (pts.length < 2) return '';
      const W = 100, H = 26;
      const path = pts.map((v, n) => `${(n / (pts.length - 1)) * W},${H - ((v - 0.4) / 2.1) * H}`).join(' ');
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${W}" y1="${H - (0.6 / 2.1) * H}" y2="${H - (0.6 / 2.1) * H}" stroke="#26313c"/><polyline points="${path}" fill="none" stroke="#6cb4ff" stroke-width="1.5"/></svg>`;
    };
    const cell = (k) => {
      const v = S.market[k], hw = hwMult(k);
      return `<div><span class="meta">${TYPES[k].name}</span><b class="${v > 1.05 ? 'up' : v < 0.95 ? 'down' : ''}">×${v.toFixed(2).replace('.', ',')}</b>${spark(k)}<span class="meta ${hw > 1.05 ? 'warn' : hw < 0.95 ? 'ok' : ''}">железо ×${hw.toFixed(2).replace('.', ',')}</span></div>`;
    };
    const tr = S.trend ? `<p class="muted"><b class="warn">${S.trend.name}</b> — ${S.trend.desc} Ещё ${Math.ceil(S.trend.left / 24)} дн.</p>` : '<p class="muted">Рынок спокоен. Индекс умножает оплату новых контрактов. Цена железа идёт за спросом, а ваши крупные закупки её разгоняют.</p>';
    return `<h3>Рынок</h3><div class="mkt">${['cpu', 'sto', 'gpu'].map(cell).join('')}</div>${tr}`;
  }
  const wearText = (t) => `${Math.round((t.age || 0) / 24)} дн. · поломки ×${(1 + (t.age || 0) / 480).toFixed(1).replace('.', ',')}`;
  function hallPanel() {
    const hi = S.cur, H = S.halls[hi];
    if (!H.open) return '<h3>Зал не арендован</h3><p class="muted">Арендуйте зал, чтобы строить.</p>';
    const racks = H.grid.filter((t) => t && t.k === 'rack');
    const free = racks.reduce((a, t) => a + RACK_SLOTS - t.s.length, 0);
    const broken = racks.reduce((a, t) => a + t.broken, 0);
    const models = Object.keys(MODELS).filter((k) => !MODELS[k].req || hasTech(MODELS[k].req));
    const fill = free ? models.map((k) => `<button class="btn" type="button" data-act="fillhall" data-a="${k}" ${S.money < priceOf(k) ? 'disabled' : ''}><span>${MODELS[k].name} ${typeTag(MODELS[k].type)}<small>до ${free} шт. · по ${fmt$(priceOf(k))}</small></span><span class="price">${fmt$(priceOf(k) * free)}</span></button>`).join('') : '<p class="muted">Свободных слотов нет. Поставьте стойки.</p>';
    const ups = [];
    models.forEach((from) => models.forEach((to) => {
      if (MODELS[from].type !== MODELS[to].type || MODELS[to].cap <= MODELS[from].cap) return;
      const n = hallServerCount(hi, from);
      if (!n) return;
      const cost = priceOf(to) - sellOf(from);

        if (!H.open) return '';
