  function update3D(now, frac) {
    if (!G3.root || G3.sig !== sig3D()) build3D();
    const D = HALLS[S.cur], H = S.halls[S.cur];
    const dark = H.open && H.dark;
    const c = G3.color;

    // LEDs and temperature strips
    G3.srv.forEach((s, j) => {
      const t = H.grid[s.i];
      if (!t || t.k !== 'rack') return;
      const working = t.s.length - t.broken;
      let col;
      if (dark || t.fire) col = 0x06080a;
      else if (s.n >= working) col = Math.floor(now / 300) % 2 ? 0xff2a2a : 0x2a0606;
      else col = Math.sin(now / (60 + ((s.i * 7 + s.n * 13) % 60)) + s.n * 1.3) > -0.25 ? 0x4dff9a : 0x0b3320;
      G3.leds.setColorAt(j, c.setHex(col));
    });
    if (G3.leds.instanceColor) G3.leds.instanceColor.needsUpdate = true;
    G3.racks.forEach((i, j) => { const t = H.grid[i]; if (t) G3.strip.setColorAt(j, c.setHex(stripColor(t, dark))); });
    if (G3.strip.instanceColor) G3.strip.instanceColor.needsUpdate = true;
    if (!dark) G3.fans.forEach((f, k) => { f.rotation.y = now / 70 + k; });
    const outage = S.event && S.event.type === 'outage';
    G3.upsLeds.forEach((m, k) => { m.material = outage ? (Math.floor(now / 350 + k) % 2 ? G3.mat.ledWarn : G3.mat.ledOff) : G3.mat.ledOn; });

    // fires
    let firePos = null;
    H.grid.forEach((t, i) => {
      if (!t || !t.fire) { const f = G3.fires.get(i); if (f) { G3.root.remove(f); G3.fires.delete(i); } return; }
      let f = G3.fires.get(i);
      if (!f) {
        f = new THREE.Group();
        for (let n = 0; n < 7; n++) {
          const cone = new THREE.Mesh(G3.geo.cone, n % 2 ? G3.mat.fire2 : G3.mat.fire1);
          cone.position.set((Math.random() - 0.5) * 0.6, 2.1, (Math.random() - 0.5) * 0.6);
          f.add(cone);
        }
        f.position.set(wx(i, D), 0, wz(i, D));
        G3.root.add(f); G3.fires.set(i, f);
      }
      f.children.forEach((cone, n) => { const s = 0.7 + 0.6 * Math.abs(Math.sin(now / 90 + n * 1.9)); cone.scale.set(1, s * 1.4, 1); cone.position.y = 2.05 + s * 0.35; });
      if (!firePos) firePos = f.position;
    });

    // lighting
    const k = dark ? 0.15 : 1;
    G3.hemi.intensity = 0.6 * k;
    G3.dir.intensity = 0.75 * k;
    G3.cold.intensity = dark ? 0 : 0.7;
    if (firePos) { G3.alarm.position.set(firePos.x, 2.6, firePos.z); G3.alarm.color.setHex(0xff6a1a); G3.alarm.distance = 18; G3.alarm.intensity = 2.2 + Math.sin(now / 60) * 0.8; }
    else if (dark) { G3.alarm.position.set(0, 3, 0); G3.alarm.color.setHex(0xff2a2a); G3.alarm.distance = 40; G3.alarm.intensity = 0.6 + 0.6 * Math.max(0, Math.sin(now / 250)); }
    else G3.alarm.intensity = 0;

    // overlays
    G3.labels.forEach((sp) => { sp.visible = false; });
    G3.heat.visible = S.view === 'heat' && H.open;
    if (G3.heat.visible) {
      const cooled = new Set();
      H.grid.forEach((t, i) => {
        const b = t && BUILD[t.k];
        if (!b || !b.cool) return;
        const x0 = i % D.w, y0 = Math.floor(i / D.w);
        for (let y = y0 - b.r; y <= y0 + b.r; y++) for (let x = x0 - b.r; x <= x0 + b.r; x++) if (x >= 0 && y >= 0 && x < D.w && y < D.h) cooled.add(y * D.w + x);
      });
      for (let i = 0; i < D.w * D.h; i++) {
        const t = H.grid[i];
        const hot = t && (t.k === 'rack' || t.k === 'miner');
        const show = hot || cooled.has(i);
        G3.m4.compose(G3.v.set(wx(i, D), 0.012, wz(i, D)), G3.qFlat, G3.sc.set(show ? 0.96 : 0, show ? 0.96 : 0, 1));
        G3.heat.setMatrixAt(i, G3.m4);
        G3.heat.setColorAt(i, c.setHex(hot ? heatColor(t.temp) : 0x1d4f8f));
        if (hot) label3D(`h${i}`, `${Math.round(t.temp)}°`, '#ffffff', wx(i, D), 2.5, wz(i, D));
      }
      G3.heat.instanceMatrix.needsUpdate = true;
      if (G3.heat.instanceColor) G3.heat.instanceColor.needsUpdate = true;
    } else if (S.view === 'power' && H.open) {
      H.grid.forEach((t, i) => {
        if (!t) return;
        const b = BUILD[t.k] || {};
        const kw = t.k === 'rack' ? t.s.reduce((a, m) => a + MODELS[m].kw, 0) : b.kw || 0;
        const text = b.power ? `+${b.power}` : b.backup ? `R${b.backup}` : kw ? kw.toFixed(1) : '';
        if (text) label3D(`p${i}`, text, b.power || b.backup ? '#f2d24a' : '#d6e0ea', wx(i, D), 2.5, wz(i, D));
      });
    }

    // people
    let used = 0;
    const personAt = (shirt, x, z, walking, face) => {
      let p = G3.people[used];
      if (!p) { p = person(shirt); G3.people.push(p); }
      p.children[1].material = shirt;
      p.visible = true;
      const bob = walking ? Math.abs(Math.sin(now / 120 + used)) * 0.06 : 0;
      p.position.set(x, bob, z);
      if (face !== undefined) p.rotation.y = face;
      used++;
    };
    if (H.open) {
      const door = { x: -D.w / 2 - 0.4, z: 0 };
      const jobsHere = S.jobs.filter((j) => j.h === S.cur);
      jobsHere.forEach((j) => {
        const tx = wx(j.i, D), tz = wz(j.i, D) + 0.8;
        const p = clamp((j.t + frac) / j.travel, 0, 1);
        const x = door.x + (tx - door.x) * p, z = door.z + (tz - door.z) * p;
        personAt(G3.mat.shirt, x, z, p < 1, Math.atan2(tx - door.x, tz - door.z));
      });
      const idle = Math.max(0, S.staff.admin - S.jobs.length);
      if (S.cur === 0 || jobsHere.length === 0) for (let n = 0; n < Math.min(idle, 4); n++) personAt(G3.mat.shirt, -D.w / 2 - 0.55, 1 + n * 0.45, false, Math.PI / 2);
      if (S.staff.guard > 0) {
        const pw = D.w + 1.4, ph = D.h + 1.4, per = 2 * (pw + ph);
        let d = ((now / 1000) * 0.8) % per;
        let x, z, face;
        if (d < pw) { x = -pw / 2 + d; z = ph / 2; face = Math.PI / 2; }
        else if ((d -= pw) < ph) { x = pw / 2; z = ph / 2 - d; face = Math.PI; }
        else if ((d -= ph) < pw) { x = pw / 2 - d; z = -ph / 2; face = -Math.PI / 2; }
        else { d -= pw; x = -pw / 2; z = -ph / 2 + d; face = 0; }
        personAt(G3.mat.guard, x, z, true, face);
      }
    }
    for (let n = used; n < G3.people.length; n++) G3.people[n].visible = false;

    // hover / selection / cooling range
    const place3 = (m, i, size) => { m.visible = true; m.position.x = wx(i, D); m.position.z = wz(i, D); m.scale.set(size, size, 1); };
    G3.hoverM.visible = false; G3.selM.visible = false; G3.rangeM.visible = false;
    if (H.open && hover >= 0 && hover < D.w * D.h) {
      const t = H.grid[hover];
      const okPlace = S.tool === 'select' ? true : S.tool === 'demolish' ? !!t : !t;
      G3.hoverM.material = okPlace ? G3.mat.hover : G3.mat.hoverBad;
      place3(G3.hoverM, hover, 0.98);
      const b = BUILD[S.tool];
      if (b && b.cool && okPlace) place3(G3.rangeM, hover, b.r * 2 + 1);
    }
    if (S.sel && S.sel.h === S.cur) {
      place3(G3.selM, S.sel.i, 1.02);
      const t = H.grid[S.sel.i], b = t && BUILD[t.k];
      if (b && b.cool) place3(G3.rangeM, S.sel.i, b.r * 2 + 1);
    }

    G3.ctl.update();
    G3.R.render(G3.scene, G3.cam);
  }

  // ================= INPUT =================
  document.addEventListener('pointerdown', (e) => { if (e.target.closest('#tab, #mail')) pressing = true; });
  const release = () => setTimeout(() => { pressing = false; }, 0);
  document.addEventListener('pointerup', release);
  document.addEventListener('pointercancel', release);
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    Sound.init();
    const f = ACT[b.dataset.act];
    if (!f) return;
    if (!['speed', 'pause', 'tab', 'view', 'tool', 'hall'].includes(b.dataset.act)) Sound.click();
    f(b.dataset.a);
    renderUI();
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    if (e.code === 'Space' && S.started && e.target === document.body) { e.preventDefault(); S.paused = !S.paused; renderUI(); }
    if (e.key === 'Escape') { S.tool = 'select'; S.sel = null; renderUI(); }
    const keys = { 1: 'rack', 2: 'crac', 3: 'chiller', 4: 'ups', 5: 'gen', 6: 'trafo' };
    if (keys[e.key] && S.started) { const k = keys[e.key]; if (!BUILD[k].req || hasTech(BUILD[k].req)) { S.tool = k; renderUI(); } }
  });
  window.addEventListener('resize', () => layoutCanvas());

  // ================= OVERLAYS =================
  function showOverlay(mode) {
    const card = $('#card');
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { saved = null; }
    if (mode === 'start') {
      card.innerHTML = `<h2>ЦОД Магнат</h2>
        <p>У вас каморка под лестницей, одна стойка и $3 000. Цель — построить гиперскейл-кампус на 3 мегаватта.</p>
        <ul>
          <li>Подписывайте контракты с клиентами: сайты, банки, игры, видео, нейросети.</li>
          <li>Ставьте стойки и серверы, следите за теплом и мощностью зала.</li>
          <li>Нанимайте админов и безопасников, исследуйте технологии, арендуйте новые залы.</li>
          <li>Отвечайте на письма: инвесторы, стажёр Петя, майнеры и пожарная инспекция.</li>
          <li>Пожары, DDoS, отключения света и экскаваторы прилагаются. При авариях игра сама встаёт на паузу.</li>
        </ul>
        ${saved && saved.v === 1 && !saved.over ? `<button class="btn primary" type="button" data-act="load">Продолжить · день ${saved.day}, ${fmt$(saved.money)}</button><button class="btn" type="button" data-act="newgame">Новая игра</button>` : `<button class="btn primary" type="button" data-act="newgame">Начать</button>`}`;
    } else if (mode === 'menu') {
      card.innerHTML = `<h2>Пауза</h2><p>Игра сохраняется сама каждый игровой день.</p>
        <button class="btn primary" type="button" data-act="resume">Продолжить</button>
        <button class="btn" type="button" data-act="autopause">Автопауза при авариях: ${S.autoPause ? 'вкл' : 'выкл'}</button>
        <button class="btn" type="button" data-act="save">Сохранить сейчас</button>
        <button class="btn danger" type="button" data-act="reset">Начать заново</button>`;
    } else if (mode === 'confirm') {
      card.innerHTML = `<h2>Начать заново?</h2><p>Текущий прогресс будет удалён.</p>
        <button class="btn danger" type="button" data-act="newgame">Да, удалить и начать</button>
        <button class="btn" type="button" data-act="resume">Отмена</button>`;
    } else if (mode === 'win') {
      Sound.win();
      card.innerHTML = `<h2>Вы — гиперскейлер</h2><p>За ${S.day} дней вы прошли путь от каморки под лестницей до кампуса на 3 мегаватта. Серверов: ${countServers()}.</p>
        <button class="btn primary" type="button" data-act="keep">Играть дальше</button>`;
    } else {
      card.innerHTML = `<h2>Банкротство</h2><p>Три дня в минусе — кредиторы забрали серверы. Вы продержались ${S.day} дней и выполнили ${S.stats.done} контрактов.</p>
        <button class="btn primary" type="button" data-act="newgame">Новая игра</button>`;
    }
    $('#overlay').hidden = false;
  }
  ACT.load = () => {
    try {
      const data = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (data && data.v === 1) { const base = newState(); S = Object.assign(base, data); S.staff = Object.assign({ admin: 0, eng: 0, guard: 0, sales: 0, acct: 0 }, data.staff); if (!G3.ok) S.mode = '2d'; S.started = true; S.paused = false; S.sel = null; $('#overlay').hidden = true; afterLoad(); log('Игра загружена'); return; }
    } catch (e) { /* fall through */ }
    ACT.newgame();
  };

  function save() {
    if (S.over) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && S && S.started) save(); });

  // ================= LOOP =================
  let acc = 0, prev = performance.now();
  function frame(now) {
    const dt = Math.min(250, now - prev); prev = now;
    if (S.started && !S.paused && !S.over && $('#overlay').hidden) {
      acc += dt * S.speed;
      let n = 0, ticked = false;
      while (acc >= HOUR_MS && n < 12 && !S.over) { tick(); acc -= HOUR_MS; n++; ticked = true; }
      if (n >= 12) acc = 0;
      if (ticked) renderUI();
    }
    const frac = S.paused ? 0 : acc / HOUR_MS;
    if (S.mode === '3d' && G3.ok) update3D(now, frac); else draw(now, frac);
    requestAnimationFrame(frame);
  }

  function afterLoad() {
    for (const k in last) delete last[k];
    logDirty = true;
    layoutCanvas();
    renderUI();
  }

  function start(data) {
    if (data && data.S) { S = data.S; } else { newState(); }
    afterLoad();
    if (!S.started) showOverlay('start');
    else if (S.over) showOverlay('over');
    requestAnimationFrame(frame);
  }

  window.claude?.hot?.snapshot?.(() => ({ S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
